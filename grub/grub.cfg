# ProjectEku GRUB menu (embedded into the image via memdisk) - Galaxy J7 (2015)
# Not: bir menu girdisi donerse GRUB "Press any key" ile tus bekler; telefonda klavye yok.
# Bu yuzden her girdi 'exit' ile biter (startup.nsh sonrasinda Linux'u baslatir) ya da bekler.
set timeout=5
set timeout_style=menu
set default=0
terminal_output console
clear

function eku_banner {
    clear
    echo ''
    echo ' ____            _           _   _____ _'
    echo '|  _ \ _ __ ___ (_) ___  ___| |_| ____| | ___   _'
    echo '| |_) | '"'"'__/ _ \| |/ _ \/ __| __|  _| | |/ / | | |'
    echo '|  __/| | | (_) | |  __/ (__| |_| |___|   <| |_| |'
    echo '|_|   |_|  \___// |\___|\___|\__|_____|_|\_\\__,_|'
    echo '              |__/'
    echo ''
    echo '    ProjectEku Linux 6.12'
    echo ''
}

menuentry "ProjectEku Linux 6.12" {
    eku_banner
    echo '    Baslatiliyor...'
    sleep 2
    clear
    exit
}

menuentry "ProjectEku ekran testi" {
    eku_banner
    echo '    GRUB 2.12 - Galaxy J7 (2015) / Exynos 7580'
    echo '    Linux icin Enter...'
    read eku_dummy
    clear
    exit
}
